<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Video - ViPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-300">
    <div x-data="downloadPage" class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
        
        <template x-if="isValid">
            <div class="bg-slate-800 border border-slate-700 p-8 md:p-12 rounded-2xl shadow-xl shadow-slate-900/50 max-w-lg w-full">
                <div class="flex justify-center items-center gap-4 mb-4">
                    <svg class="w-14 h-14" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="logoGradientDL" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5;"/><stop offset="100%" style="stop-color:#a855f7;"/></linearGradient></defs><path d="M85,15 L85,85 L15,85 C15,85 45,65 45,50 C45,35 15,15 15,15 Z" fill="url(#logoGradientDL)"/></svg>
                    <h1 class="text-5xl font-bold text-slate-100">ViPlay</h1>
                </div>
                
                <div x-show="!downloadStarted">
                    <p class="text-slate-400 mt-2 mb-8">Mempersiapkan unduhan Anda...</p>
                    <div class="flex items-center justify-center">
                        <svg class="animate-spin h-10 w-10 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </div>
                </div>

                <div x-show="downloadStarted">
                    <p class="text-slate-400 mt-2 mb-8">Unduhan Anda telah dimulai. Jika tidak, klik tombol di bawah.</p>
                    <button @click="triggerDownload" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-6 rounded-lg flex items-center justify-center gap-2 transition-all duration-300">
                        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z" /><path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z" /></svg>
                        <span>Download Manual</span>
                    </button>
                </div>

            </div>
        </template>
        
        <template x-if="!isValid">
            <div class="bg-slate-800 border border-slate-700 p-8 md:p-12 rounded-2xl">
                <h2 class="text-3xl font-bold text-red-400 mb-4">Link Tidak Valid</h2>
                <p class="text-slate-400 mb-6">Link unduhan tidak ditemukan. Silakan kembali dan coba lagi.</p>
                <a href="/" class="text-indigo-400 hover:text-indigo-300 font-semibold">Kembali ke Halaman Utama</a>
            </div>
        </template>
    </div>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('downloadPage', () => ({
            isValid: false,
            videoId: '',
            downloadStarted: false,
            proxyUrl: 'https://stream.videyhost.my.id/download_proxy.php',

            init() {
                this.videoId = sessionStorage.getItem('viplayDownloadId');
                
                if (this.videoId) {
                    this.isValid = true;
                    setTimeout(() => {
                        this.triggerDownload();
                    }, 2000); // Tunggu 2 detik sebelum memulai otomatis
                } else {
                    this.isValid = false;
                }
            },
            
            triggerDownload() {
                if (!this.videoId) return;
                this.downloadStarted = true;
                window.location.href = `${this.proxyUrl}?id=${this.videoId}`;
            }
        }));
    });
    </script>
</body>
</html>
