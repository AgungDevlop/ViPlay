<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Video - ViPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-300">
    <div x-data="downloadPage" class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
        
        <template x-if="isValid">
            <div class="bg-slate-800 border border-slate-700 p-8 md:p-12 rounded-2xl shadow-xl shadow-slate-900/50 max-w-lg w-full">
                <div class="flex justify-center items-center gap-4 mb-4">
                    <svg class="w-14 h-14" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="logoGradientDL" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5;"/><stop offset="100%" style="stop-color:#a855f7;"/></linearGradient></defs><path d="M85,15 L85,85 L15,85 C15,85 45,65 45,50 C45,35 15,15 15,15 Z" fill="url(#logoGradientDL)"/></svg>
                    <h1 class="text-5xl font-bold text-slate-100">ViPlay</h1>
                </div>
                <p class="text-slate-400 mt-2 mb-8" x-text="statusText"></p>

                <div class="w-full bg-slate-600 rounded-full h-4 mb-2 overflow-hidden">
                    <div class="bg-gradient-to-r from-indigo-500 to-violet-500 h-4 rounded-full transition-all duration-500" :style="`width: ${progress}%`"></div>
                </div>
                <p class="text-sm text-slate-400 mb-8" x-text="`${progress.toFixed(0)}%`"></p>

                <button @click="triggerDownload" :disabled="!isReady" 
                        :class="isReady ? 'bg-indigo-600 hover:bg-indigo-500 cursor-pointer' : 'bg-slate-600 cursor-not-allowed opacity-50'"
                        class="w-full text-white font-bold py-4 px-6 rounded-lg flex items-center justify-center gap-2 transition-all duration-300">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z" /><path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z" /></svg>
                    <span>Download Sekarang</span>
                </button>
            </div>
        </template>
        
        <template x-if="!isValid">
            <div class="bg-slate-800 border border-slate-700 p-8 md:p-12 rounded-2xl">
                <h2 class="text-3xl font-bold text-red-400 mb-4">Link Tidak Valid</h2>
                <p class="text-slate-400 mb-6">Link unduhan tidak ditemukan. Silakan kembali dan coba lagi.</p>
                <a href="/" class="text-indigo-400 hover:text-indigo-300 font-semibold">Kembali ke Halaman Utama</a>
            </div>
        </template>
    </div>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('downloadPage', () => ({
            isValid: false,
            videoUrl: '',
            videoId: '',
            isReady: false,
            statusText: 'Mempersiapkan unduhan...',
            progress: 0,
            blobUrl: null,

            async init() {
                this.videoUrl = sessionStorage.getItem('viplayDownloadUrl');
                this.videoId = sessionStorage.getItem('viplayDownloadId') || 'video.mp4';
                
                if (this.videoUrl) {
                    this.isValid = true;
                    this.statusText = 'Mengunduh data video...';
                    
                    try {
                        const response = await fetch(this.videoUrl);
                        if (!response.ok) throw new Error('Gagal mengambil video dari CDN.');

                        const contentLength = +response.headers.get('Content-Length');
                        const reader = response.body.getReader();
                        let receivedLength = 0;
                        let chunks = [];

                        while(true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            chunks.push(value);
                            receivedLength += value.length;
                            if (contentLength) {
                                this.progress = (receivedLength / contentLength) * 100;
                            }
                        }

                        const blob = new Blob(chunks, { type: 'video/mp4' });
                        this.blobUrl = URL.createObjectURL(blob);
                        this.isReady = true;
                        this.statusText = 'Video Anda siap untuk diunduh.';

                    } catch(error) {
                        this.statusText = 'Gagal memuat video. Silakan coba lagi.';
                        console.error('Download error:', error);
                    }
                } else {
                    this.isValid = false;
                }
            },
            
            triggerDownload() {
                if (!this.isReady || !this.blobUrl) return;
                const link = document.createElement('a');
                link.href = this.blobUrl;
                link.download = `${this.videoId}.mp4`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(this.blobUrl);
            }
        }));
    });
    </script>
</body>
</html>
